[package]
name = "ochub-ui"
version = "0.3.0"
edition = "2024"
rust-version = "1.97.0"
license = "GPL-3.0-or-later"
authors = ["OcHub contributors"]
repository = "https://github.com/OcHub-team/ochub-ui"
description = "OcHub's reusable GPUI design system for native and WebAssembly applications"
readme = "README.md"
keywords = ["gpui", "desktop", "ui", "ochub"]
categories = ["gui"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", rev = "a8fafdd7ee36fb3fb98ebbfe5d3be983301d9e74" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
similar = { version = "2.7", default-features = false, features = ["text"] }
tempfile = "3"
unicode-segmentation = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
zed-text = { git = "https://github.com/zed-industries/zed", package = "text", rev = "a8fafdd7ee36fb3fb98ebbfe5d3be983301d9e74" }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", rev = "a8fafdd7ee36fb3fb98ebbfe5d3be983301d9e74" }
wasm-bindgen = "0.2"

[build-dependencies]
toml = "1.1"

[dev-dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", rev = "a8fafdd7ee36fb3fb98ebbfe5d3be983301d9e74", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
